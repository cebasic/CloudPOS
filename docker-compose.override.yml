# Desarrollo local: monta el código fuente para ver cambios de templates
# sin reconstruir la imagen. Docker Compose carga este archivo automáticamente.
# (No subir a producción; está pensado solo para la máquina de desarrollo.)
services:
  web:
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_DEBUG: "True"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1"
