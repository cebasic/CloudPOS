{% extends "base.html" %}
{% block title %}Eliminar Platillo - CocosBarrancos{% endblock %}
{% block page_title %}Eliminar Platillo{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="bg-white shadow ring-1 ring-gray-200 sm:rounded-lg p-6">
        <p class="text-gray-700 mb-6">Estas seguro de que deseas eliminar el platillo <strong>{{ item.name }}</strong> (${{ item.price }})?</p>
        <form method="post" class="flex items-center gap-3">
            {% csrf_token %}
            <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500">Eliminar</button>
            <a href="{% url 'menu:category_list' %}" class="text-sm text-gray-500 hover:text-gray-700">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
