{# Base para formularios cargados como modal vía HTMX (hx-get → #modal-root) #}
<div class="modal {% block form_size %}{% endblock %}">
    <div class="modal-head">
        <div>
            <h3>{% block form_title %}{% endblock %}</h3>
            <div class="ms">{% block form_subtitle %}{% endblock %}</div>
        </div>
        <button type="button" class="modal-close" onclick="closeModal()" title="Cerrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18L18 6"/></svg>
        </button>
    </div>
    <form method="post" action="{{ request.get_full_path }}" {% block form_attrs %}{% endblock %} style="display:flex;flex-direction:column;min-height:0;flex:1">
        {% csrf_token %}
        <div class="modal-body">
            {% block form_body %}{% endblock %}
        </div>
        <div class="modal-foot">
            <span class="left">{% block form_note %}{% endblock %}</span>
            <div class="acts">
                <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                {% block form_actions %}<button type="submit" class="btn primary">Guardar</button>{% endblock %}
            </div>
        </div>
    </form>
</div>
