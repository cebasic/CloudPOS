{% if top_items %}
<div class="space-y-3">
    {% for item in top_items %}
    <div class="flex items-center gap-3">
        <span class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold shrink-0
            {% if forloop.counter == 1 %}bg-yellow-500/20 text-yellow-400
            {% elif forloop.counter == 2 %}bg-slate-600 text-slate-300
            {% elif forloop.counter == 3 %}bg-orange-500/20 text-orange-400
            {% else %}bg-slate-700 text-slate-400{% endif %}">
            {{ forloop.counter }}
        </span>
        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-slate-200 truncate">{{ item.menu_item__name }}</span>
                <span class="text-sm font-bold text-slate-300 ml-2 shrink-0">{{ item.total_qty }}</span>
            </div>
            <div class="mt-1 bg-slate-700 rounded-full h-1.5 overflow-hidden">
                {% with max_qty=top_items.0.total_qty %}
                <div class="h-full bg-brand-500 rounded-full" style="width:{% widthratio item.total_qty max_qty 100 %}%"></div>
                {% endwith %}
            </div>
        </div>
        <span class="text-xs text-slate-500 shrink-0">${{ item.total_revenue|floatformat:0 }}</span>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="flex items-center justify-center h-32 text-slate-500 text-sm">Sin datos para el periodo.</div>
{% endif %}
