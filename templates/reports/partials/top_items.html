{% if top_items %}
<div class="top-list">
    {% for item in top_items %}
    <div class="top-row">
        <span class="rk">{{ forloop.counter|stringformat:"02d" }}</span>
        <div style="min-width:0">
            <div class="nm">{{ item.menu_item__name }}</div>
            {% with max_qty=top_items.0.total_qty %}
            <span class="mini" style="width:{% widthratio item.total_qty max_qty 96 %}%"></span>
            {% endwith %}
        </div>
        <div class="qn">{{ item.total_qty }}</div>
        <div class="rev">${{ item.total_revenue|floatformat:0 }}</div>
    </div>
    {% endfor %}
</div>
{% else %}
<div style="display:flex;align-items:center;justify-content:center;height:120px" class="muted">Sin datos para el periodo.</div>
{% endif %}
