<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina — CocosBarrancos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .col-header { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.5rem 1rem; border-radius: 0.5rem 0.5rem 0 0; }
        .order-card { background: #1e2433; border-radius: 0.75rem; padding: 0.875rem; border-left: 4px solid transparent; transition: transform 0.15s; }
        .order-card:hover { transform: translateY(-1px); }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #2d3748; }
        .item-row:last-child { border-bottom: none; }
        .timer { font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 9999px; }
        .timer-ok { background: #065f46; color: #6ee7b7; }
        .timer-warn { background: #78350f; color: #fcd34d; }
        .timer-urgent { background: #7f1d1d; color: #fca5a5; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .btn-prepare { background: #2563eb; color: white; font-size: 0.7rem; font-weight: 700; padding: 0.3rem 0.75rem; border-radius: 0.375rem; border: none; cursor: pointer; }
        .btn-prepare:hover { background: #1d4ed8; }
        .btn-ready { background: #059669; color: white; font-size: 0.7rem; font-weight: 700; padding: 0.3rem 0.75rem; border-radius: 0.375rem; border: none; cursor: pointer; }
        .btn-ready:hover { background: #047857; }
        .badge-done { background: #064e3b; color: #6ee7b7; font-size: 0.65rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 9999px; }
        .col-pending { border-top: 3px solid #f59e0b; }
        .col-preparing { border-top: 3px solid #3b82f6; }
        .col-ready { border-top: 3px solid #10b981; }
        .empty-col { text-align: center; color: #4b5563; padding: 2rem 0; font-size: 0.85rem; }
        .ws-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .ws-connected { background: #10b981; box-shadow: 0 0 6px #10b981; }
        .ws-disconnected { background: #ef4444; }
        .order-notes { font-size: 0.7rem; color: #9ca3af; font-style: italic; margin-top: 0.25rem; }
    </style>
</head>
<body class="h-full flex flex-col">

{# Top bar #}
<header style="background:#131929; border-bottom:1px solid #1e2d3d;" class="flex items-center justify-between px-6 py-3 shrink-0">
    <div class="flex items-center gap-3">
        <div style="background:#ea580c; border-radius:0.5rem; padding:0.4rem;">
            <svg style="width:1.25rem;height:1.25rem;color:white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/>
            </svg>
        </div>
        <span style="font-size:1.1rem;font-weight:800;color:#f1f5f9;letter-spacing:-0.02em;">Pantalla de Cocina</span>
    </div>
    <div style="display:flex;align-items:center;gap:1.5rem;">
        <span id="clock" style="font-size:1.5rem;font-weight:700;color:#f1f5f9;letter-spacing:0.05em;font-variant-numeric:tabular-nums;"></span>
        <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="ws-dot ws-disconnected" id="ws-dot"></span>
            <span id="ws-label" style="font-size:0.75rem;color:#6b7280;">Conectando...</span>
        </div>
        <span id="order-count" style="font-size:0.75rem;color:#6b7280;"></span>
        <a href="{% url 'orders:dashboard' %}" style="font-size:0.75rem;color:#6b7280;text-decoration:none;padding:0.4rem 0.75rem;background:#1e2433;border-radius:0.5rem;">← Volver</a>
    </div>
</header>

{# Kanban #}
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;padding:1rem;flex:1;overflow:hidden;">

    {# Pendientes #}
    <div style="display:flex;flex-direction:column;overflow:hidden;">
        <div class="col-header col-pending" style="background:#1c1a0e;color:#f59e0b;">
            Pendientes <span id="pending-count" style="opacity:0.7;font-weight:400;"></span>
        </div>
        <div id="pending-col" style="background:#161a24;border-radius:0 0 0.75rem 0.75rem;padding:0.75rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:0.5rem;">
            <div class="empty-col">Sin órdenes pendientes</div>
        </div>
    </div>

    {# Preparando #}
    <div style="display:flex;flex-direction:column;overflow:hidden;">
        <div class="col-header col-preparing" style="background:#0d1829;color:#60a5fa;">
            Preparando <span id="preparing-count" style="opacity:0.7;font-weight:400;"></span>
        </div>
        <div id="preparing-col" style="background:#0f1520;border-radius:0 0 0.75rem 0.75rem;padding:0.75rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:0.5rem;">
            <div class="empty-col">Nada preparándose</div>
        </div>
    </div>

    {# Listos #}
    <div style="display:flex;flex-direction:column;overflow:hidden;">
        <div class="col-header col-ready" style="background:#0a1c14;color:#34d399;">
            Listos para Servir <span id="ready-count" style="opacity:0.7;font-weight:400;"></span>
        </div>
        <div id="ready-col" style="background:#0c1a12;border-radius:0 0 0.75rem 0.75rem;padding:0.75rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:0.5rem;">
            <div class="empty-col">Sin items listos</div>
        </div>
    </div>

</div>

<script>
(function() {
    var ws = null;
    var orders = [];

    // Clock
    function updateClock() {
        var now = new Date();
        document.getElementById('clock').textContent =
            now.toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Timer helpers
    function getElapsedMinutes(tsMs) {
        return Math.floor((Date.now() - tsMs) / 60000);
    }
    function timerClass(mins) {
        if (mins < 10) return 'timer timer-ok';
        if (mins < 20) return 'timer timer-warn';
        return 'timer timer-urgent';
    }
    function timerLabel(mins) {
        if (mins < 1) return '<1 min';
        return mins + ' min';
    }

    // Update all timers every 30s
    setInterval(function() {
        if (orders.length) render();
    }, 30000);

    function connect() {
        var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + location.host + '/ws/kitchen/');
        ws.onopen = function() {
            document.getElementById('ws-dot').className = 'ws-dot ws-connected';
            document.getElementById('ws-label').textContent = 'En vivo';
        };
        ws.onclose = function() {
            document.getElementById('ws-dot').className = 'ws-dot ws-disconnected';
            document.getElementById('ws-label').textContent = 'Reconectando...';
            setTimeout(connect, 3000);
        };
        ws.onmessage = function(e) {
            var data = JSON.parse(e.data);
            if (data.type === 'initial' || data.type === 'update') {
                orders = data.orders;
                render();
            }
        };
    }

    window.sendItemStatus = function(itemId, newStatus, orderId) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({action:'update_item_status',item_id:itemId,status:newStatus,order_id:orderId}));
        }
    };

    function esc(t) {
        if (!t) return '';
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    function renderCard(order, columnType) {
        var mins = order.created_at_ts ? getElapsedMinutes(order.created_at_ts) : null;
        var timerHtml = mins !== null
            ? '<span class="' + timerClass(mins) + '">' + timerLabel(mins) + '</span>'
            : '';

        var borderColor = columnType === 'pending' ? '#f59e0b' : columnType === 'preparing' ? '#3b82f6' : '#10b981';

        var itemsHtml = '';
        var hasItems = false;
        for (var i = 0; i < order.items.length; i++) {
            var item = order.items[i];
            var targetStatus = columnType === 'pending' ? 'pending' : columnType === 'preparing' ? 'preparing' : 'ready';
            if (item.status !== targetStatus) continue;
            hasItems = true;

            var notes = item.notes ? '<div style="font-size:0.7rem;color:#9ca3af;margin-top:0.2rem;">' + esc(item.notes) + '</div>' : '';
            var actionBtn = '';
            if (columnType === 'pending') {
                actionBtn = '<button class="btn-prepare" onclick="sendItemStatus(' + item.id + ',\'preparing\',' + order.id + ')">Preparar</button>';
            } else if (columnType === 'preparing') {
                actionBtn = '<button class="btn-ready" onclick="sendItemStatus(' + item.id + ',\'ready\',' + order.id + ')">✓ Listo</button>';
            } else {
                actionBtn = '<span class="badge-done">✓ Listo</span>';
            }

            itemsHtml += '<div class="item-row">' +
                '<div style="min-width:0;">' +
                '<div style="font-size:0.9rem;font-weight:600;color:#f1f5f9;">' + esc(item.quantity) + '× ' + esc(item.name) + '</div>' +
                notes +
                '</div>' +
                '<div style="margin-left:0.75rem;shrink:0;">' + actionBtn + '</div>' +
                '</div>';
        }
        if (!hasItems) return '';

        var notesHtml = order.notes ? '<div class="order-notes">"' + esc(order.notes) + '"</div>' : '';

        return '<div class="order-card" style="border-left-color:' + borderColor + ';">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">' +
            '<div>' +
            '<div style="font-size:0.85rem;font-weight:700;color:#f1f5f9;">Mesa ' + esc(String(order.table_number)) + ' <span style="color:#6b7280;font-weight:400;font-size:0.75rem;">#' + esc(String(order.id)) + '</span></div>' +
            '<div style="font-size:0.7rem;color:#6b7280;">' + esc(order.waiter) + ' · ' + esc(order.created_at) + '</div>' +
            notesHtml +
            '</div>' +
            timerHtml +
            '</div>' +
            '<div>' + itemsHtml + '</div>' +
            '</div>';
    }

    function render() {
        var pendingCards = [], preparingCards = [], readyCards = [];

        for (var i = 0; i < orders.length; i++) {
            var order = orders[i];
            var hasPending = order.items.some(function(it){return it.status==='pending';});
            var hasPreparing = order.items.some(function(it){return it.status==='preparing';});
            var hasReady = order.items.some(function(it){return it.status==='ready';});
            if (hasPending) pendingCards.push(renderCard(order, 'pending'));
            if (hasPreparing) preparingCards.push(renderCard(order, 'preparing'));
            if (hasReady) readyCards.push(renderCard(order, 'ready'));
        }

        var pc = pendingCards.filter(Boolean).length;
        var prc = preparingCards.filter(Boolean).length;
        var rc = readyCards.filter(Boolean).length;

        document.getElementById('order-count').textContent = orders.length + ' orden(es) activa(s)';
        document.getElementById('pending-count').textContent = pc ? '(' + pc + ')' : '';
        document.getElementById('preparing-count').textContent = prc ? '(' + prc + ')' : '';
        document.getElementById('ready-count').textContent = rc ? '(' + rc + ')' : '';

        var pc_html = pendingCards.filter(Boolean).join('');
        document.getElementById('pending-col').innerHTML = pc_html || '<div class="empty-col">Sin órdenes pendientes</div>';

        var prc_html = preparingCards.filter(Boolean).join('');
        document.getElementById('preparing-col').innerHTML = prc_html || '<div class="empty-col">Nada preparándose</div>';

        var rc_html = readyCards.filter(Boolean).join('');
        document.getElementById('ready-col').innerHTML = rc_html || '<div class="empty-col">Sin items listos</div>';
    }

    connect();
})();
</script>
</body>
</html>
